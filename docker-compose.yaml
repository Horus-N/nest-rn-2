services:
  dev-database:
    image: postgres:15.0
    container_name: dev-database
    ports:
      - 5434:5432 #{port in host(myPC)} : {port in container}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ABC123456789
      POSTGRES_DB: testdb
    networks:
      - dev-network

  test-database:
    image: postgres:15.0
    container_name: test-database
    ports:
      - 5435:5432 #{port in host(myPC)} : {port in container}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ABC123456789
      POSTGRES_DB: testdb
    networks:
      - dev-network
networks:
  dev-network:
